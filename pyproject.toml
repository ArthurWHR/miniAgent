[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miniagent"
version = "0.1.0"
description = "A minimal general-purpose agent framework in Python, learning from pi's core architecture."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/miniagent"]
